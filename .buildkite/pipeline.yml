# Ported from CircleCI, which ran exactly one job in this repo: publish the
# image on main. There is no build or test job to port, and the image wraps an
# upstream Go binary that is fetched at build time - so there is deliberately
# NO registry layer cache here. A cached layer would pin an old upstream, which
# is the opposite of what this image is for.

steps:
  - label: ":docker: Build and publish image (GHCR)"
    key: docker_publish
    if: build.branch == "main"
    agents:
      queue: mac-studio-linux
    env:
      IMAGE: ghcr.io/nickbrett1/vikunja-mcp
    commands:
      - |
        # Credentials come from Doppler at runtime using the agent's
        # DOPPLER_TOKEN, so no registry token sits in the agent environment hook
        # (CircleCI supplied them through its "context: common").
        GHCR_USERNAME=nickbrett1
        GHCR_TOKEN="$$(curl -fsS -H "Authorization: Bearer $$DOPPLER_TOKEN" "https://api.doppler.com/v3/configs/config/secret?project=common&config=prd&name=GHCR_UPDATE_TOKEN" | sed -n 's/.*"raw"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
        if [ -z "$$GHCR_TOKEN" ]; then
          echo "GHCR_UPDATE_TOKEN is missing from Doppler (common/prd)." >&2
          exit 1
        fi
        echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USERNAME" --password-stdin
      - docker buildx create --use --bootstrap || true
      - >
        docker buildx build --platform linux/amd64
        -t $$IMAGE:$$BUILDKITE_COMMIT
        -t $$IMAGE:latest
        --push .
