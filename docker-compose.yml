# Docker Compose for vikunja-mcp (NAS / Synology Container Manager)
#
# Runs the published GHCR image (ghcr.io/nickbrett1/vikunja-mcp) and is
# auto-updated by Watchtower on each new GHCR publish. On this NAS the service
# is declared inside the vikunja project's compose.yaml (it must share a
# network with the `vikunja` container) — this file is the standalone
# equivalent for other hosts / a Container Manager "Project".
#
# Copy .env.example to .env and set VIKUNJA_TOKEN.

services:
  vikunja-mcp:
    image: ghcr.io/nickbrett1/vikunja-mcp:latest
    container_name: vikunja-mcp
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "8086:8000"
    environment:
      TZ: ${TZ:-US/Eastern}
      VIKUNJA_URL: ${VIKUNJA_URL:-http://vikunja:3456}
      VIKUNJA_TOKEN: ${VIKUNJA_TOKEN}
      VIKUNJA_MCP_TRANSPORT: ${VIKUNJA_MCP_TRANSPORT:-http}
      VIKUNJA_MCP_HOST: ${VIKUNJA_MCP_HOST:-0.0.0.0}
      VIKUNJA_MCP_PORT: ${VIKUNJA_MCP_PORT:-8000}
    networks:
      - default
      - ai_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  ai_proxy:
    external: true
