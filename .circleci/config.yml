version: 2.1

jobs:
  docker-publish:
    docker:
      - image: cimg/base:stable
    environment:
      IMAGE: ghcr.io/nickbrett1/vikunja-mcp
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Login to Container Registry
          command: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
      - run:
          name: Build and Push Image
          command: |
            docker buildx create --use --bootstrap || true
            # No registry layer cache: this image wraps an upstream Go binary
            # (`go install ...@latest`), so every run must fetch the latest
            # upstream. Building from a clean cache guarantees that.
            docker buildx build --platform linux/amd64 \
              -t $IMAGE:$CIRCLE_SHA1 -t $IMAGE:latest --push .

workflows:
  publish:
    jobs:
      - docker-publish:
          context: common
          filters:
            branches:
              only: main
